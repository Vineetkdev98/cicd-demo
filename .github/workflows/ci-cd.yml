name: CI/CD Pipeline

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:

  # ============================================================
  # CI
  # ============================================================

  build-and-test:

    name: CI - Build and Test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Run unit tests
        run: mvn clean test


      - name: Package application
        run: mvn package -DskipTests


  # ============================================================
  # CD
  # ============================================================

  deploy:

    name: CD - Deploy Application

    runs-on: ubuntu-latest

    needs:
      - build-and-test

    if: github.event_name != 'pull_request'

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Build application
        run: mvn clean package -DskipTests


      - name: Build Docker image
        run: docker build -t ci-cd-demo:latest .


      - name: Start application
        run: docker run -d --name ci-cd-demo -p 8080:8080 ci-cd-demo:latest


      - name: Wait for application
        run: sleep 10


      - name: Health check
        run: curl --fail http://localhost:8080/api/health


      - name: Test application API
        run: curl --fail http://localhost:8080/api/hello


      - name: Show running container
        run: docker ps


      - name: Show application logs
        run: docker logs ci-cd-demo


      - name: Stop application
        if: always()
        run: docker rm -f ci-cd-demo || true