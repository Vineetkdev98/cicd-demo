name: CI/CD Pipeline

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:

  # ============================================================
  # CI
  # ============================================================

  build-and-test:

    name: CI - Build and Test

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Java
      # --------------------------------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # --------------------------------------------------------
      # Unit Tests
      # --------------------------------------------------------

      - name: Run unit tests
        run: mvn clean test


      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------

      - name: Package application
        run: mvn package -DskipTests


      # --------------------------------------------------------
      # Show generated JAR
      # --------------------------------------------------------

      - name: Show generated JAR
        run: ls -lh target/*.jar


      # --------------------------------------------------------
      # Upload JAR artifact
      # --------------------------------------------------------

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-cd-demo-jar
          path: target/ci-cd-demo-1.0.0.jar


      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------

      - name: Build Docker image
        run: docker build -t ci-cd-demo:latest .


      # --------------------------------------------------------
      # Save Docker image
      # --------------------------------------------------------

      - name: Save Docker image
        run: docker save ci-cd-demo:latest -o ci-cd-demo.tar


      # --------------------------------------------------------
      # Show Docker image
      # --------------------------------------------------------

      - name: Show Docker image
        run: docker images ci-cd-demo


      # --------------------------------------------------------
      # Upload Docker image artifact
      # --------------------------------------------------------

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-cd-demo-docker-image
          path: ci-cd-demo.tar


  # ============================================================
  # CD
  # ============================================================

  deploy:

    name: CD - Deploy Application

    runs-on: ubuntu-latest

    needs:
      - build-and-test

    if: github.event_name != 'pull_request'

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Java
      # --------------------------------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # --------------------------------------------------------
      # Build application
      # --------------------------------------------------------

      - name: Build application
        run: mvn clean package -DskipTests


      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------

      - name: Build Docker image
        run: docker build -t ci-cd-demo:latest .


      # --------------------------------------------------------
      # Start application
      # --------------------------------------------------------

      - name: Start application
        run: |
          docker run -d \
            --name ci-cd-demo \
            -p 8080:8080 \
            ci-cd-demo:latest


      # --------------------------------------------------------
      # Wait
      # --------------------------------------------------------

      - name: Wait for application
        run: sleep 10


      # --------------------------------------------------------
      # Health check
      # --------------------------------------------------------

      - name: Health check
        run: |
          curl --fail http://localhost:8080/api/health


      # --------------------------------------------------------
      # API test
      # --------------------------------------------------------

      - name: Test application API
        run: |
          curl --fail http://localhost:8080/api/hello


      # --------------------------------------------------------
      # Docker verification
      # --------------------------------------------------------

      - name: Show running container
        run: docker ps


      # --------------------------------------------------------
      # Application logs
      # --------------------------------------------------------

      - name: Show application logs
        run: docker logs ci-cd-demo


      # --------------------------------------------------------
      # Cleanup
      # --------------------------------------------------------

      - name: Stop application
        if: always()
        run: docker rm -f ci-cd-demo || true